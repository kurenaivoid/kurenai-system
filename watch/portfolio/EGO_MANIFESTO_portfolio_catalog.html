<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGO_MANIFESTO // CYBERPUNK PORTFOLIO</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0a0a0a;
            --accent-red: #ff003c;
            --accent-red-soft: rgba(255, 0, 60, 0.12);
            --accent-glow: rgba(255, 0, 60, 0.4);
            --text-main: #f0f0f0;
            --text-sub: #888888;
            --border-color: #222222;
        }

        * { box-sizing: border-box; }

        body {
            background:
                radial-gradient(circle at 50% -15%, rgba(255,0,60,.045), transparent 32rem),
                var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px 20px 60px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 34px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            color: var(--text-main);
            text-shadow: 0 0 10px var(--accent-glow);
            margin: 0 0 10px;
        }

        p.subtitle {
            font-size: .9rem;
            color: var(--text-sub);
            letter-spacing: 2px;
            margin: 0;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin: 0 auto 40px;
            max-width: 1200px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 9px 18px;
            font-family: inherit;
            font-size: .82rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all .2s ease;
        }

        .tab.active,
        .tab:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
            background: var(--accent-red-soft);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: linear-gradient(180deg, #0b0b0b 0%, var(--card-bg) 100%);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            border-color: var(--accent-red);
            transform: translateY(-3px);
            box-shadow: 0 5px 18px rgba(255,0,60,.15);
        }

        .card.is-hidden { display: none; }

        .preview-box {
            position: relative;
            width: 100%;
            height: 180px;
            background: #020202;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-box::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,0,60,.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,0,60,.08) 1px, transparent 1px);
            background-size: 15px 15px;
            z-index: 1;
            pointer-events: none;
        }

        .preview-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.4) 50%);
            background-size: 100% 3px;
            pointer-events: none;
            z-index: 4;
        }

        .real-thumb {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
        }

        .thumb-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(0,0,0,.05) 0%,
                rgba(0,0,0,.12) 55%,
                rgba(0,0,0,.5) 100%
            );
            z-index: 3;
            pointer-events: none;
        }

        .thumb-graphic {
            position: absolute;
            inset: 15px;
            border: 1px solid rgba(255,0,60,.3);
            background:
                radial-gradient(circle at center, rgba(255,0,60,.10) 0%, rgba(0,0,0,.8) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .thumb-graphic::before {
            content: attr(data-feed);
            font-size: .65rem;
            color: var(--accent-red);
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 6px var(--accent-glow);
        }

        .signal-wave {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 25px;
        }

        .signal-wave span {
            width: 4px;
            background: var(--accent-red);
            opacity: .7;
            animation: pulse 1.5s infinite alternate;
        }

        .signal-wave span:nth-child(1) { height: 8px; animation-delay:.1s; }
        .signal-wave span:nth-child(2) { height:15px; animation-delay:.2s; }
        .signal-wave span:nth-child(3) { height:25px; animation-delay:.4s; }
        .signal-wave span:nth-child(4) { height:10px; animation-delay:.6s; }
        .signal-wave span:nth-child(5) { height:18px; animation-delay:.3s; }

        @keyframes pulse {
            0% { transform: scaleY(.4); opacity:.3; }
            100% { transform: scaleY(1); opacity:.9; }
        }

        .card-info {
            padding: 18px 20px 20px;
        }

        .tag-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .tag {
            font-size: .7rem;
            color: var(--accent-red);
            letter-spacing: 1px;
            font-weight: bold;
            border-left: 2px solid var(--accent-red);
            padding-left: 7px;
        }

        .tag-id {
            color: #555;
            font-size: .62rem;
            letter-spacing: 1px;
        }

        .title {
            font-size: .92rem;
            font-weight: bold;
            color: var(--text-main);
            margin: 0;
            line-height: 1.5;
        }

        .empty-note {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            border: 1px dashed #222;
            color: #555;
            text-align: center;
            display: none;
        }

        .empty-note.visible { display: block; }

        .loading-note {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            border: 1px dashed #222;
            color: #555;
            text-align: center;
        }

        .error-note {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            border: 1px dashed rgba(255,0,60,.35);
            color: var(--accent-red);
            text-align: center;
            display: none;
        }

        @media (max-width: 900px) {
            .grid-container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 14px 45px;
            }

            h1 {
                font-size: 1.8rem;
                letter-spacing: 3px;
            }

            p.subtitle {
                font-size: .72rem;
                line-height: 1.5;
            }

            .grid-container {
                grid-template-columns: 1fr;
            }

            .tab {
                flex: 1 1 40%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>EGO_MANIFESTO</h1>
        <p class="subtitle">CYBERPUNK MINIMALIST PORTFOLIO // HIGH-FIDELITY ARCHIVE</p>
    </header>

    <div class="nav-tabs" id="navTabs" aria-label="Asset filters"></div>

    <div class="loading-note" id="loadingNote">
        LOADING ARCHIVE...
    </div>

    <div class="error-note" id="errorNote">
        DATA ARCHIVE UNAVAILABLE
    </div>

    <div class="grid-container" id="assetGrid"></div>

    <div class="empty-note" id="emptyNote">
        NO ASSETS IN THIS CATEGORY
    </div>

    <script>
        const DATA_URL = 'data.json';

        let assets = [];
        let currentFilter = 'ALL';

        const navTabs = document.getElementById('navTabs');
        const assetGrid = document.getElementById('assetGrid');
        const emptyNote = document.getElementById('emptyNote');
        const loadingNote = document.getElementById('loadingNote');
        const errorNote = document.getElementById('errorNote');

        function escapeHTML(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function normalizeThumbPath(thumb) {
            if (!thumb) return '';

            const value = String(thumb).trim();

            if (!value) return '';

            // data:image/... のようなBase64画像
            if (value.startsWith('data:image/')) {
                return value;
            }

            // http / https の絶対URL
            if (/^https?:\/\//i.test(value)) {
                return value;
            }

            // ./ や /watch/portfolio/ などを整理
            let path = value
                .replace(/^\.\/+/, '')
                .replace(/^\/+/, '');

            if (path.startsWith('watch/portfolio/')) {
                path = path.substring('watch/portfolio/'.length);
            }

            // GitHub Pagesの現在位置からの相対パス
            return path;
        }

        function buildTabs() {
            const categoryMap = {};

            assets.forEach(item => {
                const category = item.category || 'OTHER';
                categoryMap[category] = (categoryMap[category] || 0) + 1;
            });

            navTabs.innerHTML = '';

            const allButton = document.createElement('button');
            allButton.className = 'tab active';
            allButton.dataset.filter = 'ALL';
            allButton.textContent = `ALL ASSETS [${assets.length}]`;
            navTabs.appendChild(allButton);

            Object.entries(categoryMap).forEach(([category, count]) => {
                const button = document.createElement('button');
                button.className = 'tab';
                button.dataset.filter = category;
                button.textContent = `${category} [${count}]`;
                navTabs.appendChild(button);
            });

            navTabs.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentFilter = tab.dataset.filter;

                    navTabs.querySelectorAll('.tab').forEach(t => {
                        t.classList.remove('active');
                    });

                    tab.classList.add('active');

                    renderCards();
                });
            });
        }

        function createFallbackGraphic(index) {
            return `
                <div class="thumb-graphic" data-feed="CAM_FEED_${String(index + 1).padStart(2, '0')}">
                    <div class="signal-wave">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
        }

        function createCard(item, index) {
            const category = escapeHTML(item.category || 'OTHER');
            const title = escapeHTML(item.title || 'UNTITLED');
            const id = escapeHTML(item.id || `ID:${String(index + 1).padStart(2, '0')}`);
            const url = escapeHTML(item.url || '#');
            const thumb = normalizeThumbPath(item.thumb);

            let previewHTML;

            if (thumb) {
                previewHTML = `
                    <img
                        class="real-thumb"
                        src="${escapeHTML(thumb)}"
                        alt="${title}"
                        loading="lazy"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                    >
                    <div class="thumb-overlay"></div>
                    <div class="thumb-graphic" data-feed="IMAGE_FEED_${String(index + 1).padStart(2, '0')}" style="display:none;">
                        <div class="signal-wave">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                `;
            } else {
                previewHTML = createFallbackGraphic(index);
            }

            return `
                <a
                    class="card"
                    data-category="${category}"
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <div class="preview-box">
                        ${previewHTML}
                    </div>

                    <div class="card-info">
                        <div class="tag-row">
                            <span class="tag">${category}</span>
                            <span class="tag-id">${id}</span>
                        </div>

                        <p class="title">${title}</p>
                    </div>
                </a>
            `;
        }

        function renderCards() {
            const filtered = assets.filter(item => {
                return currentFilter === 'ALL' ||
                       (item.category || 'OTHER') === currentFilter;
            });

            assetGrid.innerHTML = '';

            if (filtered.length === 0) {
                emptyNote.classList.add('visible');
                return;
            }

            emptyNote.classList.remove('visible');

            assetGrid.innerHTML = filtered
                .map((item) => {
                    const originalIndex = assets.indexOf(item);
                    return createCard(item, originalIndex);
                })
                .join('');
        }

        async function loadData() {
            loadingNote.style.display = 'block';
            errorNote.style.display = 'none';
            assetGrid.innerHTML = '';
            emptyNote.classList.remove('visible');

            try {
                const response = await fetch(`${DATA_URL}?t=${Date.now()}`, {
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error(`data.json取得失敗 (${response.status})`);
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error('data.jsonの形式が配列ではありません。');
                }

                assets = data;

                loadingNote.style.display = 'none';

                buildTabs();
                renderCards();

            } catch (error) {
                console.error('[PORTFOLIO DATA ERROR]', error);

                loadingNote.style.display = 'none';
                errorNote.textContent =
                    `DATA ARCHIVE UNAVAILABLE // ${error.message}`;

                errorNote.style.display = 'block';
            }
        }

        loadData();
    </script>

</body>
</html>
