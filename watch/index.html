<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PORTFOLIO / YOUTUBE | KURENAI VOID</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#070707;
    --panel:#0d0d0d;
    --line:rgba(255,255,255,.08);
    --text:#f4f4f4;
    --muted:#8b8b8b;
    --accent:#a31212;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
}

body{
    position:relative;
}

/* subtle grid */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg,var(--line) 1px, transparent 1px);

    background-size:64px 64px;
    opacity:.16;
    pointer-events:none;
}

/* scan texture */

body::after{
    content:"";
    position:fixed;
    inset:0;

    background:
    repeating-linear-gradient(
        180deg,
        rgba(255,255,255,.01) 0px,
        rgba(255,255,255,.01) 1px,
        transparent 2px,
        transparent 4px
    );

    pointer-events:none;
}

.wrapper{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:48px 7vw;

    position:relative;
    z-index:1;
}

/* HEADER */

header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:24px;
}

.header-left{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.page-title{
    font-size:.95rem;
    letter-spacing:.28em;
    font-weight:600;
}

.system-tag{
    color:var(--muted);
    font-size:.74rem;
    letter-spacing:.14em;
    text-transform:uppercase;
}

.header-right{
    color:var(--muted);
    font-size:.72rem;
    letter-spacing:.18em;
    text-align:right;
}

/* MAIN */

main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

.language-gate{
    width:min(760px,100%);
    text-align:center;
    animation:fadeUp 1.2s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.section-label{
    color:var(--accent);
    font-size:.75rem;
    letter-spacing:.24em;
    margin-bottom:20px;
}

.main-title{
    font-size:clamp(2.2rem,6vw,5rem);
    font-weight:500;
    letter-spacing:-0.04em;
    line-height:1;
}

.divider{
    position:relative;
    height:1px;
    margin:36px auto;
    background:var(--line);
    max-width:420px;
    overflow:hidden;
}

.divider::after{
    content:"";
    position:absolute;
    top:0;
    left:-25%;
    width:25%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(163,18,18,.8),
        transparent
    );

    animation:scan 8s linear infinite;
}

@keyframes scan{
    from{
        left:-25%;
    }

    to{
        left:125%;
    }
}

.language-list{
    display:flex;
    flex-direction:column;
    gap:14px;
    max-width:420px;
    margin:0 auto;
}

.language-card{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 24px;

    border:1px solid var(--line);

    text-decoration:none;

    color:var(--text);

    transition:.35s ease;

    background:rgba(255,255,255,.015);
}

.language-card:hover{
    border-color:rgba(163,18,18,.45);
    transform:translateY(-2px);
    background:rgba(255,255,255,.025);
}

.language-name{
    font-size:1rem;
    letter-spacing:.08em;
}

.language-arrow{
    color:var(--muted);
}

.language-card:hover .language-arrow{
    color:var(--text);
}

/* FOOTER */

footer{
    margin-top:80px;

    border-top:1px solid var(--line);

    padding-top:24px;

    display:flex;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
}

.signature{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.signature-title{
    font-size:.82rem;
    letter-spacing:.12em;
    color:#d9d9d9;
}

.signature-site a{
    color:var(--muted);
    text-decoration:none;
    transition:.3s;
}

.signature-site a:hover{
    color:white;
}

.footer-meta{
    color:var(--muted);
    font-size:.74rem;
    letter-spacing:.16em;
}

/* MOBILE */

@media(max-width:768px){

    .wrapper{
        padding:28px;
    }

    header{
        flex-direction:column;
    }

    footer{
        flex-direction:column;
    }

    .language-card{
        padding:18px 18px;
    }

}

</style>
</head>

<body>

<div class="wrapper">

<header>

    <div class="header-left">

        <div class="page-title">
            PORTFOLIO / KURENAI VOID
        </div>

        <div class="system-tag">
            KURENAI SYSTEM / CREATIVE ARCHIVE
        </div>

    </div>

    <div class="header-right">
        CONTENT GATE<br>
        ACCESS POINT
    </div>

</header>

<main>

<section class="language-gate">

    <div class="section-label">
        SELECT CONTENT
    </div>

    <h1 class="main-title">
        Which Would You Like to See?
    </h1>

    <div class="divider"></div>

    <div class="language-list">

        <!-- PORTFOLIO -->
        <a href="./portfolio/EGO_MANIFESTO_portfolio_catalog.html" class="language-card">

            <span class="language-name">
                PORTFOLIO
            </span>

            <span class="language-arrow">
                →
            </span>

        </a>

        <!-- YOUTUBE -->
        <a href="https://www.youtube.com/@Hatenko-Channel"
           class="language-card"
           target="_blank"
           rel="noopener noreferrer">

            <span class="language-name">
                YouTube
            </span>

            <span class="language-arrow">
                →
            </span>

        </a>

    </div>

</section>

</main>

<footer>

    <div class="signature">

        <div class="signature-title">
            KURENAI SYSTEM — Built Beyond the Prompt.
        </div>

        <div class="signature-site">

            <a href="https://kurenaivoid.com"
               target="_blank"
               rel="noopener noreferrer">

                kurenaivoid.com

            </a>

        </div>

    </div>

    <div class="footer-meta">
        KURENAI VOID / CONTENT ACCESS
    </div>

</footer>

</div>

</body>
</html>
