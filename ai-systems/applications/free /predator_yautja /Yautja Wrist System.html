<div id="panel"><h1>YAUTJA WRIST SYSTEM</h1>
<label>表示モード</label><select id="mode"><option value="stream">入力文字列を流す</option><option value="random">完全ランダム</option></select>
<label>テキスト</label><input id="message" value="AVIUTESSSIUYU" maxlength="120">
<div class="row"><div><label>切替速度 <span class="val" id="speedVal">1.8秒</span></label><input id="speed" type="range" min=".08" max="5" step=".02" value="1.8"></div><div><label>文字サイズ <span class="val" id="sizeVal">100%</span></label><input id="size" type="range" min="70" max="150" value="100"></div></div>
<label>演出</label><select id="fx"><option value="cinema">シネマティック・解析</option><option value="calm">低速・待機</option><option value="alert">警戒・警告</option><option value="minimal">機械表示のみ</option><option value="pulse">脈動・同期</option><option value="glitch">信号干渉</option><option value="predator">YAUTJA実機風</option><option value="selfdestruct">SELF-DESTRUCT / 自爆</option></select>
<label>画像位置 <span class="val" id="imgPosVal">0 / 0</span></label>
<div class="row"><input id="imgX" type="range" min="-120" max="120" step="1" value="0" title="左右"><input id="imgY" type="range" min="-80" max="80" step="1" value="0" title="上下"></div>
<label>画像倍率 <span class="val" id="imgScaleVal">100%</span></label>
<input id="imgScale" type="range" min="90" max="110" step=".1" value="100">
<div class="row" style="margin-top:12px"><button id="record">● 録画開始</button><button class="secondary" id="fullscreen">全画面</button></div>
<div class="row" style="margin-top:7px"><button class="secondary" id="pause">一時停止</button><button class="secondary" id="reset">表示リセット</button></div>

window.__gauntlet=gauntletImage;
function pick(){return alphabet[Math.floor(Math.random()*alphabet.length)]}
function step(){if($('mode').value==='random'){cells=cells.map(pick)}else{let s=$('message').value.toUpperCase().replace(/[^A-Z0-9]/g,'')||' ';cells=[0,1,2,3].map(i=>s[(pos+i)%s.length]||' ');pos=(pos+1)%s.length}}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
let selfDestructStart=0;
function startSelfDestruct(){selfDestructStart=tick;}
function draw(now){
 let dt=now-last;last=now;
 if(!paused){
   tick+=dt;
   let interval=+$('speed').value*1000;
   if(now-lastStep>interval){step();lastStep=now}
 }
 const W=1920,H=1080;
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#071012';ctx.fillRect(0,0,W,H);

 const device=window.__gauntlet;
 // v5: image and display share one coordinate system.
 // The green-screen margins and green display window were removed from the image.
 const imgW=1280,imgH=590;
 const userScale=+$('imgScale').value/100;
 const baseScale=1.5*userScale;
 const drawW=imgW*baseScale,drawH=imgH*baseScale;
 const drawX=(W-drawW)/2+(+$('imgX').value*baseScale);
 const drawY=(H-drawH)/2+(+$('imgY').value*baseScale);

 // Source coordinates below are relative to the cropped v5 image (1280x590).
 // The transparent display opening is approximately:
 // top-left (216,211), top-right (1047,194), bottom-right (1049,351), bottom-left (228,369).
 function windowPath(){
   ctx.beginPath();
   ctx.moveTo(228,209);
   ctx.quadraticCurveTo(216,211,216,224);
   ctx.lineTo(216,344);
   ctx.quadraticCurveTo(216,360,231,369);
   ctx.lineTo(1035,352);
   ctx.quadraticCurveTo(1049,351,1049,336);
   ctx.lineTo(1047,207);
   ctx.quadraticCurveTo(1047,194,1033,194);
   ctx.closePath();
 }

 if(device&&device.complete){
   ctx.save();
   ctx.translate(drawX,drawY);
   ctx.scale(baseScale,baseScale);

   // The display effects are painted first, so the transparent window reveals them,
   // while the real metal/red frame remains untouched above it.
   ctx.save();
   windowPath();
   ctx.clip();

   // dark glass base, following the photographed trapezoid
   const glass=ctx.createLinearGradient(0,195,0,370);
   glass.addColorStop(0,'rgba(10,14,15,.92)');
   glass.addColorStop(.25,'rgba(2,7,9,.98)');
   glass.addColorStop(.75,'rgba(3,8,10,.97)');
   glass.addColorStop(1,'rgba(30,14,13,.90)');
   ctx.fillStyle=glass;
   ctx.fillRect(205,185,860,200);

   // faint red inner reflection
   const red=ctx.createLinearGradient(0,205,0,365);
   red.addColorStop(0,'rgba(255,55,35,.08)');
   red.addColorStop(.5,'rgba(255,40,25,.015)');
   red.addColorStop(1,'rgba(255,55,35,.10)');
   ctx.fillStyle=red;ctx.fillRect(205,185,860,200);

   let size=+$('size').value/100;
   let alert=$('fx').value==='alert';
   let calm=$('fx').value==='calm';
   let pulseMode=$('fx').value==='pulse';
   let glitchMode=$('fx').value==='glitch';
   let predatorMode=$('fx').value==='predator';
   let selfDestructMode=$('fx').value==='selfdestruct';
   const sdElapsed=Math.max(0,tick-selfDestructStart);
   const sdWarning=sdElapsed<2600;
   const sdRemain=Math.max(0,20-Math.floor(Math.max(0,sdElapsed-2600)/1000));
   const sdFast=sdElapsed>=2600;
   const sdPulse=.5+.5*Math.sin(tick*(sdFast?(sdRemain<=5?.055:.035):.018));
   const sdDisplay=sdWarning?'WARN':String(sdRemain).padStart(4,'0');

   // Four characters are positioned in the photographed display, not in a separate rectangle.
   const cellW=195, cellH=142, gap=8, startX=252, startY=205;
   for(let i=0;i<4;i++){
     let x=startX+i*(cellW+gap), y=startY;
     // Each character module has its own phase, like separate physical display cells.
     let pulse=calm?.72:(.8+.2*Math.sin(tick*.008+i*1.8));
     let modulePhase=predatorMode ? Math.sin(tick*.009+i*1.73) : 0;
     let moduleOn=predatorMode ? (.72+.28*Math.max(0,modulePhase)) : 1;

     // very subtle character-cell glass, almost invisible against the photo
     ctx.fillStyle=predatorMode ? `rgba(7,12,13,${.12+.06*(1-moduleOn)})` : 'rgba(7,12,13,.16)';
     ctx.fillRect(x,y,cellW,cellH);

     if(predatorMode){
       // Faint 8x8 LED-matrix substrate: inspired by the physical four-module display construction.
       // It stays behind the Yautja glyph and is intentionally very dim.
       const mx=8,my=8, mw=cellW-30, mh=cellH-30;
       for(let ry=0;ry<my;ry++){
         for(let rx=0;rx<mx;rx++){
           const px=x+15+(rx/(mx-1))*mw;
           const py=y+15+(ry/(my-1))*mh;
           const wave=Math.sin(tick*.006+i*1.9+rx*.65+ry*.41);
           const a=.018+.018*((wave+1)/2);
           ctx.fillStyle=`rgba(255,58,38,${a})`;
           ctx.beginPath();ctx.arc(px,py,1.05,0,Math.PI*2);ctx.fill();
         }
       }
       // A narrow write/refresh row moves independently through each module.
       const refreshY=y+18+((tick*.032+i*29)%106);
       const rg=ctx.createLinearGradient(x,refreshY,x+cellW,refreshY);
       rg.addColorStop(0,'rgba(255,65,40,0)');
       rg.addColorStop(.5,'rgba(255,78,45,.075)');
       rg.addColorStop(1,'rgba(255,65,40,0)');
       ctx.fillStyle=rg;ctx.fillRect(x+10,refreshY-2,cellW-20,4);

       // Thin internal scan/highlight makes each cell feel like an independent module.
       const localY=y+18+((tick*.045+i*37)%105);
       const g=ctx.createLinearGradient(0,localY-7,0,localY+7);
       g.addColorStop(0,'rgba(255,55,35,0)');
       g.addColorStop(.5,`rgba(255,75,45,${.045+.035*moduleOn})`);
       g.addColorStop(1,'rgba(255,55,35,0)');
       ctx.fillStyle=g; ctx.fillRect(x+7,localY-7,cellW-14,14);
       // tiny activity tick at the lower edge of each module
       ctx.fillStyle=`rgba(255,65,40,${.18+.18*moduleOn})`;
       ctx.fillRect(x+14,y+cellH-7,Math.max(8,18+8*moduleOn),2);
     }

     ctx.save();
     ctx.textAlign='center';ctx.textBaseline='middle';
     ctx.font=`${Math.round(142*size)}px "Yautja"`;
     let glow=$('fx').value==='minimal'?0:(glitchMode?34:22*pulse);
     if(pulseMode)glow*=.55+.45*Math.sin(tick*.014+i);
     if(predatorMode)glow*=.72+.28*moduleOn;
     ctx.shadowColor=alert?'#ff3b20':'#e73d2d';
     ctx.shadowBlur=glow;
     ctx.fillStyle=alert
       ?(Math.sin(tick*.012)>0?'#ffb04b':'#ff3d25')
       :(glitchMode&&Math.random()<.08?'#ffb35d':'#e94b36');
     let yy=y+cellH/2+3;
     if(glitchMode&&Math.random()<.08)yy+=Math.random()*8-4;
     const displayChar=selfDestructMode ? sdDisplay[i] : cells[i];
     if(selfDestructMode){
       ctx.fillStyle=sdWarning ? (Math.sin(tick*.025)>0?'#ffb04b':'#ff3d25') : (sdRemain<=5?'#ff9a35':'#e94b36');
       ctx.shadowColor=sdRemain<=5?'#ff2b16':'#e73d2d';
       ctx.shadowBlur=24+22*sdPulse;
     }
     ctx.fillText(displayChar,x+cellW/2,yy,cellW-12);
     ctx.restore();
   }

   // Scan beam and status line remain inside the real window shape.
   if($('fx').value!=='minimal'){
     const scanSpeed=selfDestructMode?(sdFast?.30:.10):.065;
     let yy=210+(tick*scanSpeed%145);
     let beam=ctx.createLinearGradient(0,yy-14,0,yy+14);
     beam.addColorStop(0,'rgba(255,70,40,0)');
     beam.addColorStop(.5,`rgba(255,70,40,${selfDestructMode?(sdWarning?.20:.16):(alert?.16:.07)})`);
     beam.addColorStop(1,'rgba(255,70,40,0)');
     ctx.fillStyle=beam;ctx.fillRect(205,yy-14,860,28);
   }
   ctx.fillStyle=selfDestructMode?'rgba(255,65,35,.85)':(alert?'rgba(255,75,40,.65)':'rgba(150,55,45,.45)');
   ctx.fillRect(245,345,790,1);
   ctx.restore(); // display clipping

   // Finally place the real photographed device over the generated display.
   ctx.drawImage(device,0,0,imgW,imgH);

   if(predatorMode||selfDestructMode){
     ctx.save();

     // Right-side red indicators: only the middle three are animated here,
     // intentionally shortening the active vertical group to about half.
     // Coordinates are in the photographed 1280x590 image coordinate system,
     // so they follow image position/scale automatically.
     const right=[{x:1160,y:276},{x:1160,y:304},{x:1160,y:333}];
     for(let i=0;i<right.length;i++){
       const q=selfDestructMode ? (.5+.5*Math.sin(tick*(sdFast?(sdRemain<=5?.075:.048):.022)+i*2.31)) : (.5+.5*Math.sin(tick*.013+i*2.31));
       if(q<(selfDestructMode?.42:.58)) continue;
       ctx.fillStyle=`rgba(255,45,25,${selfDestructMode?.16+.38*q:.10+.28*q})`;
       ctx.shadowColor='rgba(255,35,20,.9)';
       ctx.shadowBlur=(selfDestructMode?8:6)+(selfDestructMode?8:5)*q;
       ctx.beginPath();ctx.arc(right[i].x,right[i].y,5.2+q*1.2,0,Math.PI*2);ctx.fill();
     }

     // Lower indicator group: keep the existing asynchronous pulses unchanged.
     const lower=[{x:360,y:447},{x:384,y:447},{x:408,y:447},{x:489,y:444},{x:625,y:444},{x:748,y:444}];
     for(let i=0;i<lower.length;i++){
       const q=selfDestructMode ? (.5+.5*Math.sin(tick*(sdFast?(sdRemain<=5?.082:.050):.024)+i*2.17)) : (.5+.5*Math.sin(tick*.015+i*2.17));
       if(q<(selfDestructMode?.48:.62)) continue;
       ctx.fillStyle=`rgba(255,55,30,${selfDestructMode?.12+.28*q:.08+.20*q})`;
       ctx.shadowColor='rgba(255,40,20,.8)'; ctx.shadowBlur=selfDestructMode?7:5;
       ctx.beginPath();ctx.arc(lower[i].x,lower[i].y,4+q*1.5,0,Math.PI*2);ctx.fill();
     }
     ctx.restore();
   }

   ctx.restore();
 }

 // subtle global scanlines/grain
 ctx.fillStyle='rgba(0,0,0,.10)';
 for(let y=0;y<H;y+=5)ctx.fillRect(0,y,W,1);

 requestAnimationFrame(draw);
}

function setPanelVisible(visible){
  $('panel').style.display=visible?'block':'none';
  $('hide').style.display=visible?'block':'none';
}
$('hide').onclick=()=>setPanelVisible(false);
$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};

// Keyboard control is intentionally independent of the UI panel so recording can
// continue with the panel hidden.
const fxKeys=['cinema','calm','alert','minimal','pulse','glitch','predator','selfdestruct'];
function setFxByIndex(i){
  i=(i+fxKeys.length)%fxKeys.length;
  $('fx').value=fxKeys[i];
  if(fxKeys[i]==='selfdestruct')startSelfDestruct();
}
window.addEventListener('keydown',(e)=>{
  const tag=(document.activeElement?.tagName||'').toLowerCase();
  const editing=tag==='input'||tag==='select'||tag==='textarea';
  if(editing && e.key!=='Escape') return;

  if(/^\d$/.test(e.key)){
    const n=Number(e.key);
    if(n>=1 && n<=8){e.preventDefault();setFxByIndex(n-1);return;}
  }
  if(e.key==='ArrowRight'){e.preventDefault();setFxByIndex(fxKeys.indexOf($('fx').value)+1);return;}
  if(e.key==='ArrowLeft'){e.preventDefault();setFxByIndex(fxKeys.indexOf($('fx').value)-1);return;}
  if(e.key.toLowerCase()==='p'){e.preventDefault();$('pause').click();return;}
  if(e.key.toLowerCase()==='h'){e.preventDefault();setPanelVisible($('panel').style.display==='none');return;}
  if(e.key==='Escape'){setPanelVisible(true);}
});
$('record').onclick=()=>{
 if(recorder&&recorder.state==='recording'){recorder.stop();$('record').textContent='● 録画開始';return}

 const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
 try{recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{let type=recorder.mimeType||'video/webm',blob=new Blob(chunks,{type}),ext=type.includes('mp4')?'mp4':'webm',a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yautja_wrist_recording.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};recorder.start();$('record').textContent='■ 録画停止'}catch(e){alert('このブラウザでは録画を開始できません。')}
};
